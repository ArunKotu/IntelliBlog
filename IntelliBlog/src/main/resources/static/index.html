<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntelliBlog - AI Enhanced Content</title>
  
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .page-container { min-height: calc(100vh - 80px); }
        #post-content, .post-card-content { white-space: pre-wrap; word-break: break-word; }
        .loading-animation {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-left: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body class="bg-gray-50">
<div id="app">


    <header class="bg-indigo-600 shadow-lg sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">IntelliBlog</h1>
            <nav class="flex space-x-2 sm:space-x-4">
                <button id="nav-home" class="text-white hover:text-indigo-200 font-medium">Home</button>

                <div id="auth-controls" class="flex space-x-2 sm:space-x-4">
                    <button id="nav-register" class="px-3 py-1 bg-indigo-500 hover:bg-indigo-700 text-white rounded-lg shadow-md text-sm">Register</button>
                    <button id="nav-login" class="px-3 py-1 bg-green-500 hover:bg-green-700 text-white rounded-lg shadow-md text-sm">Login</button>
                </div>

                <div id="user-controls" class="hidden flex space-x-2 sm:space-x-4 items-center">
                    <button id="nav-my-posts" class="text-white hover:text-indigo-200 font-medium">My Posts</button>
                    <button id="nav-create-post" class="px-3 py-1 bg-yellow-500 hover:bg-yellow-600 text-indigo-900 rounded-lg shadow-md text-sm">New Post</button>
                    <button id="nav-logout" class="px-3 py-1 bg-red-500 hover:bg-red-700 text-white rounded-lg shadow-md text-sm">Logout</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 sm:p-6 lg:p-8 page-container">

      
        <section id="home-section" class="view-section">
            <h2 class="text-4xl font-bold text-gray-800 mb-8 border-b-2 border-indigo-400 pb-2">Public Feed</h2>
            <div id="all-posts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="md:col-span-3 text-center py-12 text-gray-500">Loading posts...</div>
            </div>
        </section>

        <section id="auth-section" class="view-section hidden flex justify-center py-16">
            <div class="w-full max-w-lg space-y-8">

       
                <div id="register-container" class="bg-white p-8 rounded-xl shadow-lg border border-gray-200">
                    <h2 class="text-2xl font-bold text-gray-700 mb-6 text-center">Create Account</h2>
                    <input id="register-username" placeholder="Username" class="w-full p-3 mb-4 border rounded-lg">
                    <input id="register-email" placeholder="Email" class="w-full p-3 mb-4 border rounded-lg">
                    <input id="register-password" type="password" placeholder="Password" class="w-full p-3 mb-6 border rounded-lg">
                    <button onclick="handleRegister()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg">Register</button>
                    <p id="register-message" class="text-center mt-4 text-sm"></p>
                    <p class="text-center text-sm text-gray-500 mt-6">Already have an account?
                        <span onclick="showLogin()" class="text-indigo-600 hover:text-indigo-800 cursor-pointer font-medium">Log In</span>
                    </p>
                </div>

                <div id="login-container" class="bg-white p-8 rounded-xl shadow-lg border hidden">
                    <h2 class="text-2xl font-bold text-gray-700 mb-6 text-center">Login</hh2>
                    <input id="login-email" placeholder="Email" class="w-full p-3 mb-4 border rounded-lg">
                    <input id="login-password" type="password" placeholder="Password" class="w-full p-3 mb-6 border rounded-lg">
                    <button onclick="handleLogin()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg">Login</button>
                    <p id="login-message" class="text-center mt-4 text-sm"></p>
                </div>

            </div>
        </section>

   
        <section id="post-crud-section" class="view-section hidden py-16">
            <div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-lg border">

                <h2 id="post-crud-title" class="text-3xl font-bold text-gray-800 mb-6 pb-3 border-b">Create New Post</h2>
                <input type="hidden" id="post-id">
                <input id="post-title" placeholder="Title" class="w-full p-3 mb-4 border rounded-lg font-semibold">
                <textarea id="post-content" placeholder="Write full blog..." class="w-full p-3 mb-4 border rounded-lg h-64 resize-none"></textarea>

                <button onclick="generateSummary()" class="w-full sm:w-auto bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg mb-4">Generate AI Summary</button>

                <div id="ai-summary-output" class="p-4 bg-yellow-50 border-l-4 border-yellow-400 text-yellow-800 rounded-r-lg hidden mb-6">
                    <p class="font-bold">AI Summary Preview:</p>
                    <p id="summary-text" class="text-sm mt-1"></p>
                </div>

                <button onclick="savePost()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-lg text-lg">Save Post</button>
                <p id="post-message" class="text-center mt-4 text-sm"></p>
            </div>
        </section>

        <section id="my-posts-section" class="view-section hidden">
            <h2 class="text-4xl font-bold text-gray-800 mb-8 border-b-2 border-indigo-400 pb-2">My Blog Dashboard</h2>
            <div id="my-posts-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="md:col-span-3 text-center py-12 text-gray-500">Loading your posts...</div>
            </div>
        </section>
    </main>
</div>

<script>

const BASE_URL = 'https://intelliblog-6.onrender.com';
let userCredentials = null;

const createPostCard = (post, isAuthorView = false) => {

    const card = document.createElement('div');
    card.className = 'post-card bg-white rounded-xl shadow-md overflow-hidden hover:shadow-lg transition duration-300 border border-gray-100 p-6 flex flex-col justify-between';

    let buttonsHtml = '';
    if (isAuthorView) {
        buttonsHtml = `
            <div class="flex space-x-2 mt-4">
                <button onclick="editPost('${post.id}')" class="flex-1 bg-yellow-500 hover:bg-yellow-600 text-white py-2 px-4 rounded-lg text-sm">Edit</button>
                <button onclick="deletePost('${post.id}')" class="flex-1 bg-red-500 hover:bg-red-600 text-white py-2 px-4 rounded-lg text-sm">Delete</button>
            </div>
        `;
    }

    const date = new Date(post.createdAt || post.updatedAt).toLocaleDateString();

    card.innerHTML = `
        <div>
            <h3 class="text-2xl font-bold text-gray-800 mb-2">${post.title}</h3>
            <p class="text-sm text-indigo-500 mb-4">By: ${post.authorEmail}</p>

            <!-- FULL BLOG CONTENT -->
            <p class="post-card-content text-gray-700 whitespace-pre-wrap break-words mb-4">
                ${post.content}
            </p>

            <div id="summary-${post.id}" class="hidden p-3 bg-indigo-50 border-l-4 border-indigo-400 rounded-r-lg mb-4">
                <p class="font-bold">AI Summary:</p>
                <div class="summary-content text-sm mt-1"></div>
            </div>

            <button id="summarize-btn-${post.id}" onclick="summarizePost('${post.id}')" class="bg-blue-500 hover:bg-blue-600 text-white font-medium py-1 px-3 rounded-lg text-xs">Summarize Blog (AI)</button>
        </div>

        <div class="mt-4 pt-4 border-t border-gray-100">
            <p class="text-xs text-gray-500">Last updated: ${date}</p>
            ${buttonsHtml}
        </div>
    `;

    return card;
};

</script>
</body>
</html>
